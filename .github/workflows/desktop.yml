name: Desktop Web Tests (.NET Framework)

on:
  push:
    branches: [ main ]
    paths:
      - 'SauceExamples/Common/**'
      - 'SauceExamples/SeleniumMsTest/**'
      - 'SauceExamples/SeleniumNunit/**'
      - 'SauceExamples/Web.Tests/**'
      - 'SauceExamples/Selenium4DotNetFramework/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'SauceExamples/Common/**'
      - 'SauceExamples/SeleniumMsTest/**'
      - 'SauceExamples/SeleniumNunit/**'
      - 'SauceExamples/Web.Tests/**'
      - 'SauceExamples/Selenium4DotNetFramework/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

env:
  SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
  SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}

jobs:
  selenium-mstest:
    name: Selenium 3 MsTest Scripts
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore SauceExamples/SeleniumMsTest/Selenium3.MsTest.Scripts.csproj
    
    - name: Build
      run: dotnet build SauceExamples/SeleniumMsTest/Selenium3.MsTest.Scripts.csproj --no-restore --configuration Release
    
    - name: Run tests
      run: dotnet test SauceExamples/SeleniumMsTest/Selenium3.MsTest.Scripts.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=selenium-mstest-results.trx"
      continue-on-error: true
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: selenium-mstest-results
        path: '**/selenium-mstest-results.trx'

  selenium-nunit:
    name: Selenium 3 NUnit Scripts
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore SauceExamples/SeleniumNunit/Selenium3.Nunit.Scripts.csproj
    
    - name: Build
      run: dotnet build SauceExamples/SeleniumNunit/Selenium3.Nunit.Scripts.csproj --no-restore --configuration Release
    
    - name: Run tests
      run: dotnet test SauceExamples/SeleniumNunit/Selenium3.Nunit.Scripts.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=selenium-nunit-results.trx"
      continue-on-error: true
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: selenium-nunit-results
        path: '**/selenium-nunit-results.trx'

  web-tests:
    name: Web Tests Framework
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore SauceExamples/Web.Tests/Selenium3.Nunit.Framework.csproj
    
    - name: Build
      run: dotnet build SauceExamples/Web.Tests/Selenium3.Nunit.Framework.csproj --no-restore --configuration Release
    
    - name: Run tests
      run: dotnet test SauceExamples/Web.Tests/Selenium3.Nunit.Framework.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=web-tests-results.trx"
      continue-on-error: true
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: web-tests-results
        path: '**/web-tests-results.trx'

  selenium4-framework:
    name: Selenium 4 .NET Framework
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore SauceExamples/Selenium4DotNetFramework/Selenium4.MsTest.Scripts.csproj
    
    - name: Build
      run: dotnet build SauceExamples/Selenium4DotNetFramework/Selenium4.MsTest.Scripts.csproj --no-restore --configuration Release
    
    - name: Run tests
      run: dotnet test SauceExamples/Selenium4DotNetFramework/Selenium4.MsTest.Scripts.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=selenium4-framework-results.trx"
      continue-on-error: true
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: selenium4-framework-results
        path: '**/selenium4-framework-results.trx'

