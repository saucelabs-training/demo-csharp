name: Selenium Examples Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'SeleniumExamples/**'
      - '.github/workflows/selenium-examples.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'SeleniumExamples/**'
      - '.github/workflows/selenium-examples.yml'
  schedule:
    - cron: '* 4 * * *'
  workflow_dispatch:

env:
  SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
  SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}

jobs:
  mstest-examples:
    name: MSTest Examples
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore SeleniumExamples/MSTestExamples/MSTestExamples.csproj
    
    - name: Build
      run: dotnet build SeleniumExamples/MSTestExamples/MSTestExamples.csproj --no-restore --configuration Release
    
    - name: Run tests
      uses: nick-fields/retry@v4
      with:
        max_attempts: 3
        timeout_minutes: 30
        command: dotnet test SeleniumExamples/MSTestExamples/MSTestExamples.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=mstest-examples-results.trx"
    
    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: mstest-examples-results
        path: '**/mstest-examples-results.trx'

  nunit-examples:
    name: NUnit Examples
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore SeleniumExamples/NUnitExamples/NUnitExamples.csproj
    
    - name: Build
      run: dotnet build SeleniumExamples/NUnitExamples/NUnitExamples.csproj --no-restore --configuration Release
    
    - name: Run tests
      uses: nick-fields/retry@v4
      with:
        max_attempts: 3
        timeout_minutes: 30
        command: dotnet test SeleniumExamples/NUnitExamples/NUnitExamples.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=nunit-examples-results.trx"
    
    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: nunit-examples-results
        path: '**/nunit-examples-results.trx'
