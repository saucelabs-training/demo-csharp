name: Simple Dotnet Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'Dotnet/**'
      - '.github/workflows/dotnet-simple.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Dotnet/**'
      - '.github/workflows/dotnet-simple.yml'
  schedule:
    - cron: '* 4 * * *'
  workflow_dispatch:

env:
  SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
  SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}

jobs:
  dotnet-simple-tests:
    name: Simple Dotnet Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore Dotnet/Dotnet.csproj
    
    - name: Build
      run: dotnet build Dotnet/Dotnet.csproj --no-restore --configuration Release
    
    - name: Run tests
      uses: nick-fields/retry@v4
      with:
        max_attempts: 3
        timeout_minutes: 30
        command: dotnet test Dotnet/Dotnet.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=dotnet-simple-results.trx"
    
    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: dotnet-simple-results
        path: '**/dotnet-simple-results.trx'

