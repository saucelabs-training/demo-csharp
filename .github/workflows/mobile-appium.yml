name: Mobile Appium Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'SauceExamples/Core.Appium.MsTest.BestPractices/**'
      - 'SauceExamples/Core.Appium.MsTest.Scripts/**'
      - 'SauceExamples/DotnetFramework/Appium/**'
      - '.github/workflows/mobile-appium.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'SauceExamples/Core.Appium.MsTest.BestPractices/**'
      - 'SauceExamples/Core.Appium.MsTest.Scripts/**'
      - 'SauceExamples/DotnetFramework/Appium/**'
      - '.github/workflows/mobile-appium.yml'
  workflow_dispatch:

env:
  SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
  SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}

jobs:
  appium-best-practices:
    name: Appium Best Practices (NUnit)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore SauceExamples/Core.Appium.MsTest.BestPractices/Core.Appium.Nunit.BestPractices.csproj
    
    - name: Build
      run: dotnet build SauceExamples/Core.Appium.MsTest.BestPractices/Core.Appium.Nunit.BestPractices.csproj --no-restore --configuration Release
    
    - name: Run tests
      run: dotnet test SauceExamples/Core.Appium.MsTest.BestPractices/Core.Appium.Nunit.BestPractices.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=appium-best-practices-results.trx"
    
    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: appium-best-practices-results
        path: '**/appium-best-practices-results.trx'

  appium-mstest-framework:
    name: Appium MsTest (.NET Framework)
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore SauceExamples/DotnetFramework/Appium/Appium4.MsTest.Scripts/Appium4.MsTest.Scripts.csproj
    
    - name: Build
      run: dotnet build SauceExamples/DotnetFramework/Appium/Appium4.MsTest.Scripts/Appium4.MsTest.Scripts.csproj --no-restore --configuration Release
    
    - name: Run tests
      run: dotnet test SauceExamples/DotnetFramework/Appium/Appium4.MsTest.Scripts/Appium4.MsTest.Scripts.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=appium-mstest-framework-results.trx"
    
    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: appium-mstest-framework-results
        path: '**/appium-mstest-framework-results.trx'

  appium-nunit-framework:
    name: Appium NUnit (.NET Framework)
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore SauceExamples/DotnetFramework/Appium/Appium4.NUnit.Scripts/Appium4.NUnit.Scripts.csproj
    
    - name: Build
      run: dotnet build SauceExamples/DotnetFramework/Appium/Appium4.NUnit.Scripts/Appium4.NUnit.Scripts.csproj --no-restore --configuration Release
    
    - name: Run tests
      run: dotnet test SauceExamples/DotnetFramework/Appium/Appium4.NUnit.Scripts/Appium4.NUnit.Scripts.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=appium-nunit-framework-results.trx"
    
    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: appium-nunit-framework-results
        path: '**/appium-nunit-framework-results.trx'

